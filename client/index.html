<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="库存管理" />
    <meta name="theme-color" content="#1677ff" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>库存管理系统</title>
    <style>
      #preloader { display: flex; flex-direction: column; align-items: center; justify-content: center;
        height: 100vh; background: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
      #preloader .spin { width: 36px; height: 36px; border: 3px solid #e8e8e8;
        border-top-color: #1677ff; border-radius: 50%; animation: spin 0.8s linear infinite; }
      #preloader .text { margin-top: 16px; font-size: 14px; color: #999; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="preloader">
        <div class="spin"></div>
        <div class="text">加载中...</div>
      </div>
    </div>
    <script>
      (function(){
        var V = '6';
        if (localStorage.getItem('sw_ver') !== V) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(reg) { reg.unregister(); });
            });
            caches.keys().then(function(keys) { keys.forEach(function(k) { caches.delete(k); }); });
          }
          localStorage.setItem('sw_ver', V);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
